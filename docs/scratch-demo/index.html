<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Scratch to Riches — Mini Incremental</title><style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#241910;color:#f8e5b2;font-family:Georgia,serif}body{background:radial-gradient(ellipse at top,#775336,#21170f 85%)}button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}button:disabled{opacity:.4;cursor:default}button:focus-visible{outline:2px solid white}header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px clamp(12px,3vw,36px);border-bottom:1px solid #b59a6055;background:#1b150f99}h1{font-size:clamp(18px,3.3vw,36px);margin:0;color:#f6d58b;letter-spacing:.04em;text-shadow:0 2px #38210e}small{font-family:Arial,sans-serif}header small{letter-spacing:2px;font-size:9px;color:#bfa982}.tools{display:flex;gap:6px}button{border:1px solid #b69a61;border-radius:5px;background:#3b2e20;padding:10px}main{max-width:1400px;margin:auto;display:grid;grid-template-columns:minmax(0,1fr) minmax(270px,340px);gap:24px;padding:clamp(10px,2vw,26px);align-items:start}.play{min-width:0;display:flex;flex-direction:column;align-items:center}.hud{width:100%;display:flex;justify-content:space-around;background:#1a201a;border:1px solid #a48e5a;border-radius:8px;padding:9px;text-align:center}.hud small{display:block;font-size:10px;letter-spacing:1px;color:#c3b591}.hud b{display:block;font-size:24px;color:#f8d685}.tabs{width:100%;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin:12px 0}.tab{font-weight:bold;font-size:clamp(9px,1.6vw,14px);padding:9px 2px;min-width:0}.tab small{display:block;font-size:10px;margin-top:4px}.tab.active{outline:2px solid #f4d38d;outline-offset:2px}.classic{background-color:#23583c}.lucky{background-color:#8f3729}.gold{background-color:#a77317}.diamond{background-color:#175779}.ticket{width:min(100%,510px,calc((100dvh - 245px)*1.13));min-width:min(100%,260px);padding:14px;border:5px double #e0c47d;border-radius:6px;box-shadow:0 9px 18px #0009,inset 0 0 30px #0005;background-image:repeating-linear-gradient(135deg,#ffffff0b 0 1px,transparent 1px 7px),radial-gradient(ellipse at top,#ffffff28,transparent 70%)}.orn{text-align:center;color:#eac77b;letter-spacing:7px;font-size:12px}.title{text-align:center;font-size:clamp(25px,4vw,42px);font-weight:bold;color:#fff2c3;text-shadow:0 3px #37220c;margin:4px 0}.tag{text-align:center;font:10px Arial;letter-spacing:2px;margin:6px 0 10px}.board{display:grid;gap:6px;padding:7px;background:#0003;border:1px solid #ddc18b80}.cell{aspect-ratio:1;position:relative;background:radial-gradient(ellipse,#fff9df,#d9c59a);border:2px solid #917b51;overflow:hidden;isolation:isolate}.classic .cell{border-radius:5px}.lucky .cell{border-radius:16px}.gold .cell{clip-path:polygon(18% 0,82% 0,100% 18%,100% 82%,82% 100%,18% 100%,0 82%,0 18%)}.diamond .cell{clip-path:polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%)}.symbol{position:absolute;inset:0;display:grid;place-items:center;font-size:clamp(18px,4vw,48px)}canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair}.selected{border-color:#ffe17f}.win{background:#fff0a3;filter:brightness(1.18)}.win .symbol{animation:pop .4s ease-out}@keyframes pop{50%{transform:scale(1.3)}}.serial{display:flex;justify-content:space-between;font:9px monospace;color:#f0d9a1;margin-top:10px}.barcode{width:48px;height:13px;background:repeating-linear-gradient(90deg,#ddc995 0 2px,transparent 2px 3px,#ddc995 3px 4px,transparent 4px 7px)}.message{min-height:36px;text-align:center;font-weight:bold;padding:10px 0}.next{background:linear-gradient(#557e51,#294a32);width:min(100%,510px);font-weight:bold;padding:13px}.shop{background:#211a14;border:1px solid #8e744b;border-radius:8px;padding:14px}.shop h2{font-size:20px;margin:0 0 4px;color:#edcc8a}.shop>small{color:#a99a81}.upgrade{display:flex;align-items:center;gap:9px;border-bottom:1px solid #b69d5533;padding:14px 0}.upgrade:last-child{border:0}.uicon{display:grid;place-items:center;width:38px;height:38px;flex:none;border:1px solid #b7a26e;border-radius:5px;background:#453722;font-size:23px}.udesc{flex:1;min-width:0}.udesc b{font-size:14px}.udesc small{display:block;color:#b9ac90;font-size:11px;margin-top:4px;line-height:1.4}.buy{background:#496039;min-width:70px;font-size:12px;font-weight:bold;padding:10px 5px}.levels{display:flex;gap:3px;margin-top:6px}.levels i{width:13px;height:4px;background:#ffffff22}.levels i.on{background:#d9b958}.hint{font:12px/1.5 Arial;color:#c1ae91;margin:14px 0 6px}.reset{font-size:11px}.fsstatus{font:11px Arial;color:#c1ae91;text-align:right}.shopfoot{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:10px}@media(max-width:720px) and (orientation:portrait){main{grid-template-columns:1fr;gap:14px}.ticket{width:min(100%,440px)}header{padding:10px}.tools button{padding:8px;font-size:12px}.shop{padding:12px}.symbol{font-size:clamp(19px,7vw,42px)}}@media(max-height:560px) and (orientation:landscape){header{padding:5px 14px}header h1{font-size:21px}header small{display:none}main{grid-template-columns:minmax(0,1fr) minmax(230px,33%);padding:8px;gap:12px}.hud{padding:3px}.hud b{font-size:18px}.tabs{margin:7px 0}.tab{padding:4px 0}.ticket{min-width:0;width:min(100%,calc((100dvh - 155px)*.86));padding:7px}.title{font-size:20px;margin:0}.tag{margin:3px 0;font-size:8px}.orn{font-size:8px}.board{gap:3px;padding:3px}.serial{margin-top:4px;font-size:7px}.barcode{height:8px}.message{min-height:0;padding:5px;font-size:13px}.next{padding:6px}.shop{padding:9px}.upgrade{padding:7px 0}.shop h2{font-size:16px}.uicon{width:30px;height:30px}.symbol{font-size:clamp(13px,4vh,28px)}}
</style></head><body><header><div><h1>SCRATCH TO RICHES</h1><small>MINI INCREMENTAL</small></div><div class="tools"><button id="audio">♪ OFF</button><button id="fs">⛶ Schermo intero</button></div></header><main><section class="play"><div class="hud"><div><small>MONETE</small><b id="coins">0</b></div><div><small>GRATTATE</small><b id="count">0/3</b></div><div><small>BIGLIETTI</small><b id="total">0</b></div></div><div class="tabs" id="tabs"></div><div class="ticket classic" id="ticket"><div class="orn">✦ ━ ✦ ━ ✦</div><div class="title" id="title"></div><div class="tag" id="tag"></div><div class="board" id="board"></div><div class="serial"><span id="serial"></span><div class="barcode"></div><span>★ ★ ★</span></div></div><div class="message" id="msg" aria-live="polite"></div><button class="next" id="next">NUOVO BIGLIETTO ↻</button></section><aside class="shop"><h2>✦ Potenziamenti</h2><small>PERMANENTI</small><div id="upgrades"></div><p class="hint">Gratta trascinando il dito o il mouse. Acquista potenziamenti tra un biglietto e l'altro. Le monete sono virtuali.</p><div class="shopfoot"><button class="reset" id="reset">Ricomincia demo</button><span class="fsstatus" id="fsstatus"></span></div></aside></main><script>
(()=>{'use strict';const $=id=>document.getElementById(id),N=144,types=[{name:'CLASSICO',css:'classic',size:3,pool:7,base:10,price:0,unlock:0},{name:'FORTUNATO',css:'lucky',size:4,pool:6,base:30,price:10,unlock:40},{name:'DORATO',css:'gold',size:5,pool:5,base:55,price:25,unlock:120},{name:'DIAMANTE',css:'diamond',size:5,pool:4,base:70,price:60,unlock:250}],symbols=['🪙','🍀','⭐','💎','👑','💰','7️⃣'],defs=[{icon:'🖌',name:'Pennello XXL',desc:'Gratta più velocemente',cost:20,max:5},{icon:'🪙',name:'Pioggia di monete',desc:'Premio base +5 monete per livello',cost:30,max:5},{icon:'✦',name:'Scelta aggiuntiva',desc:'+1 casella su ogni biglietto',cost:60,max:2}];let money=0,kind=0,unlocked=0,serial=0,total=0,level=[0,0,0],chosen=0,revealed=0,limit=3,done=false,cells=[],sound=false,audio=null,lastAudio=0;const price=i=>Math.ceil(defs[i].cost*1.65**level[i]);const locked=()=>!done&&chosen>0;const fmt=n=>n.toLocaleString('it-IT');
function mix(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function noise(){if(!sound||!audio||Date.now()-lastAudio<65)return;lastAudio=Date.now();try{let n=Math.floor(audio.sampleRate*.055),b=audio.createBuffer(1,n,audio.sampleRate),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);let s=audio.createBufferSource(),f=audio.createBiquadFilter(),g=audio.createGain();s.buffer=b;f.type='bandpass';f.frequency.value=2200;g.gain.value=.1;s.connect(f);f.connect(g);g.connect(audio.destination);s.start()}catch{}}
function chime(){if(!sound||!audio)return;try{[523,659,784].forEach((f,i)=>{let t=audio.currentTime+i*.08,o=audio.createOscillator(),g=audio.createGain();o.frequency.value=f;g.gain.setValueAtTime(.07,t);g.gain.exponentialRampToValueAtTime(.001,t+.3);o.connect(g);g.connect(audio.destination);o.start(t);o.stop(t+.31)})}catch{}}
function foil(ctx){ctx.globalCompositeOperation='source-over';let g=ctx.createLinearGradient(0,0,N,N);['#868d8b','#dde0da','#a4aba8','#efefe8','#939895'].forEach((v,i)=>g.addColorStop(i/4,v));ctx.fillStyle=g;ctx.fillRect(0,0,N,N);for(let i=0;i<800;i++){ctx.fillStyle=Math.random()>.5?'#ffffff25':'#343e3b18';ctx.fillRect(Math.random()*N,Math.random()*N,Math.random()*16+1,1)}ctx.strokeStyle='#ffffff85';ctx.lineWidth=2;ctx.strokeRect(4,4,N-8,N-8);ctx.font='bold 54px Georgia';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle='#606b6655';ctx.fillText('★',N/2,N/2);ctx.globalCompositeOperation='destination-out'}
function inside(x,y){let a=x/N,b=y/N;if(kind===3)return a>=.25*Math.abs(2*b-1)&&a<=1-.25*Math.abs(2*b-1);if(kind===2)return a+b>=.18&&a+b<=1.82&&a-b<=.82&&b-a<=.82;return true}
function hud(){$('coins').textContent=fmt(money);$('count').textContent=revealed+'/'+limit;$('total').textContent=total;$('next').disabled=!done;$('tag').textContent='PREMIO BASE '+(types[kind].base+5*level[1])+' MONETE'}
function row(icon,name,desc,lv,max,cost,disabled,cb){let r=document.createElement('div');r.className='upgrade';let ic=document.createElement('div');ic.className='uicon';ic.textContent=icon;let txt=document.createElement('div');txt.className='udesc';let b=document.createElement('b');b.textContent=name;let sm=document.createElement('small');sm.textContent=desc;txt.append(b,sm);if(max){let l=document.createElement('div');l.className='levels';for(let j=0;j<max;j++){let dot=document.createElement('i');if(j<lv)dot.className='on';l.append(dot)}txt.append(l)}let btn=document.createElement('button');btn.className='buy';btn.textContent=max&&lv===max?'MAX':fmt(cost)+' 🪙';btn.disabled=disabled;btn.onclick=cb;r.append(ic,txt,btn);$('upgrades').append(r)}
function shop(){$('upgrades').replaceChildren();defs.forEach((d,i)=>row(d.icon,d.name,d.desc,level[i],d.max,price(i),locked()||money<price(i)||level[i]>=d.max,()=>{if(locked()||money<price(i)||level[i]>=d.max)return;money-=price(i);level[i]++;if(!done){limit=3+level[2];$('msg').textContent='Gratta '+limit+' caselle a tua scelta'}refresh()}));if(unlocked<3){let t=types[unlocked+1];row('🎟','Sblocca '+t.name,'Nuovo biglietto · premi maggiori',0,1,t.unlock,locked()||money<t.unlock,()=>{if(locked()||money<t.unlock)return;money-=t.unlock;unlocked++;refresh()})}}
function tabs(){$('tabs').replaceChildren();types.forEach((t,i)=>{let b=document.createElement('button');b.className='tab '+t.css+(kind===i?' active':'');b.textContent=(i>unlocked?'🔒 ':'')+t.name;let sm=document.createElement('small');sm.textContent=i>unlocked?'Bloccato':t.price?fmt(t.price)+' monete':'Gratis';b.append(sm);b.disabled=i>unlocked||locked()||money<t.price||(!done&&kind===i);b.onclick=()=>start(i);$('tabs').append(b)})}
function refresh(){hud();shop();tabs()}
function settle(){if(done||revealed<limit)return;done=true;total++;let count={};cells.filter(c=>c.done).forEach(c=>count[c.symbol]=(count[c.symbol]||0)+1);let best=Object.keys(count).sort((a,b)=>count[b]-count[a])[0],n=count[best];if(n>=2){let win=(types[kind].base+5*level[1])*Math.min(n,5);money+=win;$('msg').textContent='✦ '+['','','COPPIA','TRIS','POKER','CINQUINA'][Math.min(n,5)]+'! +'+fmt(win)+' MONETE';cells.filter(c=>c.done&&String(c.symbol)===best).forEach(c=>c.el.classList.add('win'));chime();try{navigator.vibrate?.([25,30,40])}catch{}}else $('msg').textContent='Nessuna vincita. Riprova!';refresh()}
function coverage(c){if(c.done||done)return;let d=c.ctx.getImageData(0,0,N,N).data,all=0,erased=0;for(let y=5;y<N;y+=6)for(let x=5;x<N;x+=6){if(!inside(x,y))continue;all++;if(d[(y*N+x)*4+3]<40)erased++}if(erased/all>=.85){c.done=true;c.ctx.clearRect(0,0,N,N);c.canvas.style.pointerEvents='none';revealed++;$('msg').textContent='Ancora '+(limit-revealed)+' caselle';hud();settle()}}
function attach(c){let pointer=null,prev=null,steps=0;function stroke(e){if(c.done||done)return;let rect=c.canvas.getBoundingClientRect(),x=(e.clientX-rect.left)*N/rect.width,y=(e.clientY-rect.top)*N/rect.height,rad=16+level[0]*4;c.ctx.lineWidth=rad*2;c.ctx.lineCap='round';c.ctx.lineJoin='round';if(prev){c.ctx.beginPath();c.ctx.moveTo(prev.x,prev.y);c.ctx.lineTo(x,y);c.ctx.stroke()}c.ctx.beginPath();c.ctx.arc(x,y,rad,0,Math.PI*2);c.ctx.fill();prev={x,y};noise();if(steps++%3===0)coverage(c)}c.canvas.addEventListener('pointerdown',e=>{if(done||c.done||pointer!==null)return;if(!c.selected){if(chosen>=limit){$('msg').textContent='Completa le caselle selezionate';return}chosen++;c.selected=true;c.el.classList.add('selected');shop();tabs()}e.preventDefault();pointer=e.pointerId;prev=null;try{c.canvas.setPointerCapture(pointer)}catch{}stroke(e)});c.canvas.addEventListener('pointermove',e=>{if(e.pointerId===pointer){e.preventDefault();stroke(e)}});function end(e){if(e.pointerId!==pointer)return;pointer=null;prev=null;coverage(c)}['pointerup','pointercancel','lostpointercapture'].forEach(n=>c.canvas.addEventListener(n,end))}
function start(i,initial=false){if(!initial&&locked()||i>unlocked||money<types[i].price)return;if(!initial)money-=types[i].price;kind=i;serial++;limit=3+level[2];chosen=0;revealed=0;done=false;cells=[];let t=types[kind];$('ticket').className='ticket '+t.css;$('title').textContent=t.name;$('serial').textContent='STR '+String(serial).padStart(6,'0');$('msg').textContent='Gratta '+limit+' caselle a tua scelta';let board=$('board');board.replaceChildren();board.style.gridTemplateColumns='repeat('+t.size+',minmax(0,1fr))';let pool=mix([0,1,2,3,4,5,6]).slice(0,t.pool);for(let j=0;j<t.size*t.size;j++){let s=pool[Math.floor(Math.random()*pool.length)],el=document.createElement('div');el.className='cell';let sym=document.createElement('div');sym.className='symbol';sym.textContent=symbols[s];let canvas=document.createElement('canvas');canvas.width=N;canvas.height=N;el.append(sym,canvas);board.append(el);let ctx=canvas.getContext('2d',{willReadFrequently:true});foil(ctx);let c={el,canvas,ctx,symbol:s,done:false,selected:false};cells.push(c);attach(c)}refresh()}
$('next').onclick=()=>start(money>=types[kind].price?kind:0);$('reset').onclick=()=>{money=0;unlocked=0;total=0;serial=0;level=[0,0,0];start(0,true)};$('audio').onclick=()=>{sound=!sound;if(sound){try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();audio.resume()}catch{sound=false}}$('audio').textContent=sound?'♪ ON':'♪ OFF'};$('fs').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else if(document.documentElement.requestFullscreen)await document.documentElement.requestFullscreen();else throw Error('unsupported');$('fsstatus').textContent=''}catch{$('fsstatus').textContent='Fullscreen non disponibile in questo browser. Apri in Chrome o usa la modalità schermo intero del browser.'}};document.addEventListener('fullscreenchange',()=>{$('fs').textContent=document.fullscreenElement?'⛶ Esci':'⛶ Schermo intero'});start(0,true);})();
</script></body></html>
