name: Scratch demo regression (static)

on:
  push:
    branches: [main, feature/radial-skill-tree-unity]
    paths:
      - "Assets/Resources/SkillCatalogV2.json"
      - "Assets/Scripts/**"
      - "QA/**"
      - ".github/workflows/demo-regression.yml"
  pull_request:
    paths:
      - "Assets/Resources/SkillCatalogV2.json"
      - "Assets/Scripts/**"
      - "QA/**"
      - ".github/workflows/demo-regression.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  catalog-and-qa-wiring:
    name: Verify 90-node catalog, demo route and regression hooks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate static demo invariants
        run: python QA/verify_demo_regression.py --static
      - name: Verify pick probabilities and ticket expected value
        run: python QA/test_pick_economy.py
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Execute production C# domain regression
        run: dotnet run --project QA/DomainChecks/DomainChecks.csproj --configuration Release

# Unity Play Mode remains a MANUAL regression: record a full autoplay
# run, then pass its 4 reports to QA/verify_demo_regression.py.
